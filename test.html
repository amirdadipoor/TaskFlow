<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="TaskFlow.css">
</head>
<body class="p-5 bg-white stark:bg-gray-900 antialiased ">
    <nav class="bg-white fixed top-0 left-0 w-full border-gray-200 stark:bg-gray-900 z-50" id="nav-style">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <span class="self-center text-2xl font-semibold whitespace-nowrap stark:text-white">TaskFlow</span>
            </a>
            <div class="flex md:order-2">
                
                <div class="relative hidden md:block">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 stark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                        </svg>
                    </div>
                    <input type="text" id="search-navbar" class="block w-full p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 stark:bg-gray-700 stark:border-gray-600 stark:placeholder-gray-400 stark:text-white stark:focus:ring-blue-500 stark:focus:border-blue-500" placeholder="جستوجو ...">
                </div>
            </div>
        </div>
    </nav>
    <div class="w-full px-4 mx-auto max-w-8xl pt-8 mt-4">
        <aside id="" class="fixed left-0 top-16 h-screen w-64 transition-transform -translate-x-full sm:translate-x-0" aria-label="Sidebar">
            <div class="h-full px-3 py-4 overflow-y-auto bg-gray-50 stark:bg-gray-800" id="sidebar-style">
                <ul class="space-y-2 font-medium">
                    <li>
                        <a href="#" class="flex items-center p-2 text-gray-900 rounded-lg stark:text-white hover:bg-gray-100 stark:hover:bg-gray-700 group">
                            <svg class="w-6 h-6 text-gray-800 stark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1v3m5-3v3m5-3v3M1 7h18M5 11h10M2 3h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"></path>
                            </svg>
                            <span class="ms-3">برد ها</span>
                        </a>
                    </li>
                
                </ul>
                <ul class="pt-4 mt-4 space-y-2 font-medium border-t border-gray-200 stark:border-gray-700">
                    <li>
                        <a href="javascript:;" class="flex items-center justify-between p-2 text-gray-900 transition duration-75 rounded-lg hover:bg-gray-100 stark:hover:bg-gray-700 stark:text-white group">
                            
                            <span class="mr-5">برد جدید</span>
                            
                            <svg  stroke="currentColor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-800 stark:text-white " id="new-board">
                                <path d="M12 4v16m8-8H4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
                            </svg>
                        
                        </a>
                    </li>
                </ul>
                <ul class="pt-4 mt-4 space-y-2 font-medium border-t border-gray-200 stark:border-gray-700">
                    <li>
                        <a href="#" class="flex items-center p-2 text-gray-900 transition duration-75 rounded-lg hover:bg-gray-100 stark:hover:bg-gray-700 stark:text-white group">
                            <svg class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 stark:text-gray-400 group-hover:text-gray-900 stark:group-hover:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
                                <path d="M18 0H6a2 2 0 0 0-2 2h14v12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2Z"/>
                                <path d="M14 4H2a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM2 16v-6h12v6H2Z"/>
                            </svg>
                            <span class="ms-3">پروژه اول</span>
                        </a>
                    </li>
                    
                    <li>
                        <a href="#" class="flex items-center p-2 text-gray-900 transition duration-75 rounded-lg hover:bg-gray-100 stark:hover:bg-gray-700 stark:text-white group">
                            <svg class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 stark:text-gray-400 group-hover:text-gray-900 stark:group-hover:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
                                <path d="M18 0H6a2 2 0 0 0-2 2h14v12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2Z"/>
                                <path d="M14 4H2a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM2 16v-6h12v6H2Z"/>
                            </svg>
                            <span class="ms-3">پروژه دوم</span>
                        </a>
                    </li>
                </ul>
                <div class="drawer">
                    <h2 class="menu-title">ایجاد لیست جدید</h2>
                    <input type="text" id="list-title" placeholder="عنوان لیست">
                    <br>
                    <button id="create-list">ایجاد</button>
                    <button id="cancle-list">انصراف</button>
                </div>
            </div>
        </aside>
    </div>
    
    <button class="new-list-button">+ ایجاد لیست جدید</button> 
    <div class="show-list">
        <ul class="list">
            <li class="list-style" style="right: 2%; background-color: #7AB2B2;">
                عنوان لیست
                <ul>
                    <li>گزارش اول</li>
                    <li>گزارش دوم</li>
                </ul>
                <button class="close">
                    <svg class="w-6 h-6 text-gray-800 stark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                      </svg>                                                  
                </button>
            </li>
            <li class="list-style" style="right: 28%; background-color: #E1F7F5;">
                عنوان لیست دوم
                <ul>
                    <li>گزارش اول</li>
                    <li>گزارش دوم</li>
                </ul>
                <button class="close">
                    <svg class="w-6 h-6 text-gray-800 stark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                    </svg>                          
                </button>
            </li>
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
